<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Meldpunt openbare verlichting</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container">
  <h1>Kapotte lantaarnpaal melden</h1>
  <form id="melding">
    <input class="form-control" name="paalnummer" placeholder="Paalnummer">
    <textarea class="form-control" name="omschrijving"></textarea>
    <input class="form-control" name="email" type="email">
    <button class="btn btn-primary">Verstuur</button>
  </form>
  <div id="resultaat"></div>
  <script src="/vendor/jquery-1.9.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $('#melding').on('submit', function (e) {
      e.preventDefault();
      var data = {};
      $(this).serializeArray().forEach(function (f) { data[f.name] = f.value; });
      $.ajax({ url: '/api/meldingen', type: 'POST', contentType: 'application/json', data: JSON.stringify(data) })
        .done(function (m) { $('#resultaat').html('Bedankt! Uw melding heeft nummer ' + m.id + ' voor paal ' + m.paalnummer); });
    });
  </script>
</body>
</html>
